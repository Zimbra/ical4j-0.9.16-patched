version: 2.1

############################################################################

references:
  checkout_job_steps: &checkout_job_steps
    steps:
      - checkout

      - run:
          name: Cloning dependency repositories..
          command: |
            git clone -b master --single-branch https://${GITHUB_ACCESS_TOKEN}@github.com/Zimbra/zm-nexus.git ~/zm-nexus
            mkdir -p ~/.zcs-deps

      - persist_to_workspace:
          root: ..
          paths:
            - ical4j-0.9.16-patched
            - zm-nexus
            - .zcs-deps

############################################################################

  build_job_steps: &build_job_steps
    steps:
      - attach_workspace:
          at: ..

      - run:
          name: Compiling required dependencies and creating artifacts
          command: |
            sudo apt-get update && \
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y ant

            cd ../ical4j-0.9.16-patched

            export JAVA_HOME=/usr/lib/jvm/java-8-openjdk-amd64

            ant package

      - persist_to_workspace:
          root: ..
          paths:
            - ical4j-0.9.16-patched/build
            - .zcs-deps

############################################################################

  publish_job_steps: &publish_job_steps
    steps:
      - attach_workspace:
          at: ..

      - run:
          name: Publishing ical4j-0.9.16-patched jar to Nexus
          command: |
            sudo apt-get update && \
            sudo DEBIAN_FRONTEND=noninteractive apt-get install -y curl

            cd ../ical4j-0.9.16-patched

            # Build artifact version
            GIT_TIMESTAMP=$(git log -1 --pretty=format:%at)
            ARTIFACT_VERSION=$(echo "$BUILD_RELEASE_NO" | cut -d'_' -f1)
            VERSION="${ARTIFACT_VERSION}.${GIT_TIMESTAMP}"

            echo "Preparing JAR for upload (version: $VERSION)"

            MODULE="ical4j-0.9.16-patched"

            TARGET_DIR="$HOME/.zcs-deps/zimbra/$MODULE"

            mkdir -p "$TARGET_DIR"

            ORIGINAL_JAR="build/ical4j.jar"

            if [ ! -f "$ORIGINAL_JAR" ]; then
              echo "No JAR found at $ORIGINAL_JAR"
              exit 1
            fi

            FINAL_JAR="${MODULE}-${VERSION}-develop-snapshot.jar"

            cp "$ORIGINAL_JAR" "$TARGET_DIR/$FINAL_JAR"

            echo "Using JAR located at: $TARGET_DIR/$FINAL_JAR"

            export MODULE_LIST="$MODULE"

            echo "Calling Nexus publish script..."

            bash ~/zm-nexus/scripts/publish-jars-to-nexus.sh "$HOME/.zcs-deps/zimbra"

            echo "Publish completed"

############################################################################

jobs:
  checkout:
    working_directory: ~/ical4j-0.9.16-patched
    shell: /bin/bash -eo pipefail
    docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-ubuntu-22.04
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
    resource_class: small
    <<: *checkout_job_steps

  build:
    working_directory: ~/ical4j-0.9.16-patched
    shell: /bin/bash -eo pipefail
    docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-ubuntu-22.04
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
    resource_class: medium
    <<: *build_job_steps

  publish:
    working_directory: ~/ical4j-0.9.16-patched
    shell: /bin/bash -eo pipefail
    circleci_ip_ranges: true
    docker:
      - image: $DOCKER_REGISTRY/zm-base-os:devcore-ubuntu-22.04
        auth:
          username: $DOCKER_USER
          password: $DOCKER_PASS
    resource_class: small
    <<: *publish_job_steps

############################################################################

workflows:
  version: 2

  main:
    jobs:
      - checkout:
          context:
            - docker-dev-registry
      - build:
          context:
            - build-info
            - docker-dev-registry
          requires:
            - checkout
      - publish:
          context:
            - docker-dev-registry
            - build-info
            - nexus-dev-artifactory
          requires:
            - build
          filters:
            branches:
              only:
                - develop
